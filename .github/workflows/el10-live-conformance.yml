name: EL10 live DNF4 native diagnostic

# Record official-family native DNF4 transaction proposals. The separate
# workload drift matrix is only Feathered's forward closure, and a green
# diagnostic job means evidence was captured, not every plan was accepted.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/el10-live-conformance.yml
      - native_rpm_dnf4_probe.py
      - native_rpm_live_probe.py
      - workloads.py
      - rpm_resolution.py
      - verify_workload_matrix.py

permissions:
  contents: read

jobs:
  el10-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: centos-stream
            image: quay.io/centos/centos:stream10
            presets: cockpit,container-tools,db-mariadb,security-audit,storage-tools
          - profile: rocky
            image: rockylinux/rockylinux:10
            presets: cockpit,storage-tools
          - profile: alma
            image: almalinux:10
            presets: cockpit,storage-tools
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Capture native DNF4 proposal without installing target RPMs
        shell: bash
        run: |
          set -euo pipefail
          dnf --version
          python3 native_rpm_dnf4_probe.py \
            --profile '${{ matrix.profile }}' --releasever 10 \
            --presets '${{ matrix.presets }}' \
            --out 'validation/ci/el10-${{ matrix.profile }}'
          cat 'validation/ci/el10-${{ matrix.profile }}/report.json' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain native DNF4 plans and upstream repository diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: el10-${{ matrix.profile }}-${{ github.sha }}
          path: validation/ci/el10-${{ matrix.profile }}/
          if-no-files-found: warn
