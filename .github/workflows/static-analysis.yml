name: static analysis

# Static analysis is configured as a ratchet over the modules covered by
# mypy.ini and ruff.toml. Extend the checked surface as additional modules meet
# the configured contracts; do not weaken existing checks to absorb regressions.
#
# Deliberately not added to windows-release.yml's release venv. That venv is
# hash-locked and feeds the Authenticode signing path; adding linters to it
# would widen the trusted dependency set of a signing pipeline to buy nothing.

on:
  # windows-release.yml calls this workflow for every push and pull request.
  # Keep one authoritative static-analysis result per commit instead of also
  # launching a duplicate top-level workflow for the same SHA.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: mypy + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install analysis tooling
        run: |
          python -m pip install --disable-pip-version-check \
            'ruff==0.14.2' 'mypy==1.18.2' 'types-PyYAML==6.0.12.20250915'
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile every in-scope Python source
        run: python check_python_sources.py

      # Configured in ruff.toml. Selects genuine-defect rules (pyflakes,
      # bugbear, a few shell-injection checks) and scopes out house style, so a
      # finding here means something is actually wrong.
      - name: ruff
        run: ruff check .

      # Configured in mypy.ini as an allowlist of modules that are clean today
      # and must stay clean, rather than a tree-wide report nobody reads. Extend
      # the list as modules are cleaned; never add one with an ignore.
      - name: mypy
        run: mypy

      - name: Host contract acceptance and rejection
        run: python check_host_contracts.py

      # The source manifest is generated evidence, not a tracked merge input.
      # Generate it from the checked-out commit, then verify that exact tree.
      - name: Generate source manifest
        run: python write_source_manifest.py
      - name: Verify generated source manifest
        run: python verify_source_checksums.py

      # The generated installer is the one artifact that executes on the
      # air-gapped target, where a shell syntax error is most expensive to
      # discover. Covers the vendor-signed RPM branch as well as the unsigned
      # one, since only the latter is reachable from the default fixture.
      - name: Generated installer shell syntax
        run: python check_installer_syntax.py
