name: native conformance
# Feathered reimplements three dependency resolvers. These jobs are the only
# evidence that the closures it calls complete are ones the real package
# managers will accept. Each job runs in a container that actually has its
# package manager, and --require turns a SKIP into a failure so a misconfigured
# worker cannot report success by validating nothing.
on:
  # Called by the release workflow so signed publication is mechanically
  # blocked on all three real package-manager oracles for the same SHA.
  workflow_call:
  workflow_dispatch:
  schedule:
    # Repository formats and package-manager behaviour drift. Catch it on a
    # cadence rather than only when someone touches the resolver.
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  apt:
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: apt-get update -qq && apt-get install -y -qq python3 python3-pip dpkg-dev
      - run: python3 -m pip install --break-system-packages -r requirements.txt
      - name: Run native APT oracle and record evidence
        shell: bash
        run: |
          mkdir -p validation/ci
          set -o pipefail
          {
            echo "github_sha=$GITHUB_SHA"
            python3 --version
            # Not piped into head: GitHub runs `shell: bash` as `bash -eo pipefail`,
            # so an early-exiting reader SIGPIPEs the writer, pipefail surfaces 141
            # and errexit aborts the step before the oracle below ever runs. This is
            # the same trap install-offline.sh already documents and avoids.
            apt_version="$(apt-get --version)"
            printf '%s\n' "${apt_version%%$'\n'*}"
            python3 native_conformance.py --require apt
          } 2>&1 | tee validation/ci/native-apt.log
      # The end-to-end build tests need a display and the dpkg tooling this job
      # already has. Until 1.2.12 they were documented as running here and did
      # not run anywhere: the Windows release job has no dpkg tooling, and this
      # job never invoked pytest. That made the only coverage of the real build
      # path unenforced.
      #
      - name: Install a display and Tk for the integration tests
        run: |
          apt-get install -y -qq xvfb xauth python3-tk
          python3 -m pip install --break-system-packages 'pytest==9.1.1'
      - name: Run the end-to-end build integration tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -o pipefail
          xvfb-run -a python3 -m pytest -q -p require_executed_tests \
            tests/test_end_to_end_build.py \
            tests/test_build_worker_isolation.py \
            tests/test_build_request_module.py \
            tests/test_build_host_contracts.py \
            tests/test_source_scope.py \
            tests/test_metadata_loading.py \
            tests/test_transaction_resolution.py \
            tests/test_transaction_inventory.py \
            tests/test_root_requests.py \
            tests/test_checksum_release_fixes.py \
            tests/test_target_release_transition.py \
            tests/test_headless_execution.py \
            tests/test_cli_replay.py \
            tests/test_kubernetes_workflows.py \
            tests/test_k8s_knowledge.py \
            tests/test_workload_version_ui.py \
            tests/test_build_preparation.py \
            tests/test_cli_native_families.py \
            tests/test_application_startup.py \
            --no-header -p no:cacheprovider -o addopts= -rs 2>&1 | tee validation/ci/integration-tests.log
      # Windows may record explicit capability skips; this required Linux job
      # must execute the entire corpus with no skip allowances on the same SHA.
      - name: Reconcile every regression test with actual phase outcomes
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -o pipefail
          xvfb-run -a python3 release_test_runner.py 2>&1 | tee validation/ci/release-gate.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-apt-${{ github.sha }}
          path: |
            validation/ci/
            validation/release-gate/
          if-no-files-found: warn
  dnf:
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install dnf tooling and an interpreter new enough for the builder
        shell: bash
        run: |
          dnf -y install rpm-build createrepo_c
          # Rocky 9's default python3 is 3.9, which cannot evaluate the PEP 604
          # type aliases the builder declares at import time (repository_tools.py
          # line 38, build_backend.py). This container exists to supply dnf and
          # rpmbuild, not to pin the interpreter, so install a modern Python
          # rather than contorting builder-side code back to 3.9. The receiver
          # scripts that really do run on old targets stay 3.9-clean regardless.
          dnf -y install python3.12 python3.12-pip || dnf -y install python3.11 python3.11-pip
          PY="$(command -v python3.12 || command -v python3.11)"
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" --version
      - run: $PY -m pip install -r requirements.txt
      - name: Run native DNF oracle and record evidence
        shell: bash
        run: |
          set -o pipefail
          {
            echo "github_sha=$GITHUB_SHA"
            "$PY" --version
            # Not piped into head: GitHub runs `shell: bash` as `bash -eo pipefail`,
            # so an early-exiting reader SIGPIPEs the writer, pipefail surfaces 141
            # and errexit aborts the step before the oracle below ever runs. This is
            # the same trap install-offline.sh already documents and avoids.
            dnf_version="$(dnf --version)"
            printf '%s\n' "${dnf_version%%$'\n'*}"
            rpmbuild --version
            "$PY" native_conformance.py --require dnf
          } 2>&1 | tee native-dnf.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-dnf-${{ github.sha }}
          path: native-dnf.log
          if-no-files-found: warn
  pacman:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: pacman -Sy --noconfirm python python-pip
      - run: python3 -m pip install --break-system-packages -r requirements.txt
      - name: Run native pacman oracle and record evidence
        shell: bash
        run: |
          set -o pipefail
          {
            echo "github_sha=$GITHUB_SHA"
            python3 --version
            # Not piped into head: GitHub runs `shell: bash` as `bash -eo pipefail`,
            # so an early-exiting reader SIGPIPEs the writer, pipefail surfaces 141
            # and errexit aborts the step before the oracle below ever runs. This is
            # the same trap install-offline.sh already documents and avoids.
            pacman_version="$(pacman --version)"
            sed -n '1,2p' <<<"$pacman_version"
            python3 native_conformance.py --require pacman
          } 2>&1 | tee native-pacman.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-pacman-${{ github.sha }}
          path: native-pacman.log
          if-no-files-found: warn
