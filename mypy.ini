# Mypy configuration for Feathered.
#
# A ratchet, not an audit. Running mypy over the whole tree reports 517 errors,
# in a historical whole-tree run. The App-global injection has now been
# removed, but implicit cross-mixin interfaces and the untyped Tk surface
# remain outside this ratchet. That historical count is not a current audit.
#
# Instead this checks an explicit allowlist of modules that are clean *today*
# and must stay clean. Every one of them is domain logic with no Tk dependency,
# which is not a coincidence: those are the modules the structural work is
# trying to produce more of.
#
# To extend: clean a module, add it below, and it can never regress. Do not add
# a module with outstanding errors and a per-module ignore -- that converts the
# ratchet back into a report.
#
# feathered_app/build_intent.py is deliberately absent too: it is Tk-free and
# guarded as core, but it imports profiles.py and workloads.py, which are not
# type-clean (45 errors). Adding it would import those errors, and the rule
# above says a module joins only when it is clean. It becomes eligible once
# profiles.py and workloads.py are annotated.
#
# The CLI now imports the Tk-free build API. That transitive boundary still
# includes untyped host/mixin methods and catalog modules; the full boundary
# is not covered by this allowlist. build_outcome.py is the typed terminal contract.
# Service feedback and publication confirmation now have checked implementations
# and explicit contracts below. Full preparation/execution hosts still pull in
# catalog and cross-mixin typing debt. Backend/transport modules now join the
# normal ratchet, but their remaining unannotated helpers are not a strict
# whole-module audit. check_host_contracts.py verifies concrete family/package
# acceptance and rejection in CI; do not claim full API coverage.

[mypy]
python_version = 3.10
ignore_missing_imports = True
strict_optional = False
warn_unused_configs = True
files =
    artifact_digests.py,
    file_hashing.py,
    bundle_baseline.py,
    payload_identity.py,
    rpm_capabilities.py,
    check_linux_installation.py,
    linux_setup.py,
    linux_launch.py,
    feathered_app/backend_registry.py,
    package_family.py,
    bundle_writer.py,
    feathered_app/prepared_plan.py,
    feathered_app/execution_feedback.py,
    background_jobs.py,
    acquisition_model.py,
    checksum_inspection.py,
    release_seed.py,
    transaction_resolution.py,
    transaction_inventory.py,
    root_requests.py,
    k8s_version.py,
    k8s_policy.py,
    k8s_discovery.py,
    k8s_knowledge.py,
    core.py,
    core_models.py,
    credential_redaction.py,
    execution_reporter.py,
    package_transfer.py,
    publication_staging.py,
    repository_config.py,
    repository_paths.py,
    rpm_metadata.py,
    rpm_resolution.py,
    artifact_verification.py,
    metadata_digests.py,
    bundle_support.py,
    openpgp_verifier.py,
    bundle_sealing.py,
    repository_loader.py,
    package_acquisition.py,
    rpm_repository_writer.py,
    rpm_target_inventory.py,
    rpm_bundle.py,
    runtime_limits.py,
    apt_core.py,
    arch_core.py,
    repository_transport.py,
    repository_tools.py,
    feathered_app/build_backend.py,
    build_spec.py,
    check_host_contracts.py,
    feathered_app/build_outcome.py,
    evidence_model.py,
    mirror_catalog.py,
    mirror_unification.py,
    receiver_preflight.py,
    release_pytest_exit.py,
    release_test_runner.py,
    source_manifest.py,
    source_model.py,
    source_readiness.py,
    target_inventory_details.py,
    trusted_receiver.py,
    verify_bundle_template.py,
    verify_source_checksums.py,
    workload_resolution.py,
    write_source_manifest.py,
    write_verifier_policy.py,
    feathered_app/build_request.py,
    feathered_app/build_services.py,
    feathered_app/build_host_contracts.py,
    feathered_app/build_service_host.py,
    feathered_app/build_publication.py,
    feathered_app/source_scope.py,
    feathered_app/metadata_loading.py,
    feathered_app/repository_universe.py,
    feathered_app/state.py,
    feathered_app/status_text.py

# These newly checked boundaries have complete annotations and no Any returns.
[mypy-feathered_app.build_host_contracts,feathered_app.build_service_host,feathered_app.build_publication,feathered_app.source_scope,feathered_app.metadata_loading,transaction_resolution,transaction_inventory,root_requests,checksum_inspection,release_seed]
strict_optional = True
disallow_any_generics = True
disallow_untyped_defs = True
check_untyped_defs = True
warn_return_any = True

# Dispatch consumes explicit host predicates; legacy resolver/publication argument
# transport is still dynamic. Check those bodies without claiming full typing.
[mypy-feathered_app.build_backend]
check_untyped_defs = True

[mypy-k8s_version,k8s_policy,k8s_discovery]
disallow_untyped_defs = True
strict_optional = True
warn_return_any = True

[mypy-background_jobs]
strict_optional = True
disallow_any_generics = True
disallow_untyped_defs = True
check_untyped_defs = True
warn_return_any = True

[mypy-feathered_app.prepared_plan,feathered_app.execution_feedback,feathered_app.build_outcome]
strict_optional = True
disallow_any_generics = True
disallow_untyped_defs = True
check_untyped_defs = True
warn_return_any = True

[mypy-bundle_baseline,payload_identity,rpm_capabilities,file_hashing,artifact_digests,package_family,bundle_writer,feathered_app.backend_registry,linux_setup,linux_launch,check_linux_installation]
strict_optional = True
disallow_any_generics = True
disallow_untyped_defs = True
check_untyped_defs = True
warn_return_any = True
